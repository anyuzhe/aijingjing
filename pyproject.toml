[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-knowledge"
version = "2.5.0"
description = "AI知识库-AI静静：本地优先的多模态知识摄取与可溯源问答桌面应用"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials>=6.7,<7",
  "PySide6-Addons>=6.7,<7",
  "huggingface-hub>=0.34,<2",
  "keyring>=25,<26",
]
documents = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "Pillow>=10,<13",
  "rapidocr>=3.4,<4",
  "onnxruntime>=1.20,<2",
]
media = [
  "faster-whisper>=1.1,<2",
  "imageio-ffmpeg>=0.5,<1",
  "yt-dlp>=2025.1,<2027",
]
apple-media = [
  "mlx-whisper>=0.4,<1",
  "mlx-audio[stt]>=0.5,<0.6",
]
speaker = [
  "pyannote.audio>=4,<5",
  "sherpa-onnx>=1.12,<2",
]
layout-ocr = [
  "paddleocr[doc-parser]>=3.2,<4",
]
semantic = [
  "fastembed>=0.8,<1",
]
build = [
  "PyInstaller>=6.10,<7",
  "pytest>=8,<10",
]
full = [
  "PySide6-Essentials>=6.7,<7",
  "PySide6-Addons>=6.7,<7",
  "huggingface-hub>=0.34,<2",
  "keyring>=25,<26",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "Pillow>=10,<13",
  "rapidocr>=3.4,<4",
  "onnxruntime>=1.20,<2",
  "faster-whisper>=1.1,<2",
  "imageio-ffmpeg>=0.5,<1",
  "yt-dlp>=2025.1,<2027",
  "fastembed>=0.8,<1",
  "sherpa-onnx>=1.12,<2",
  "PyInstaller>=6.10,<7",
  "pytest>=8,<10",
]

[project.scripts]
knowledge = "media_knowledge.cli:main"
ai-jingjing = "media_knowledge.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"media_knowledge.ui.knowledge_workbench" = ["assets/*"]
"media_knowledge.desktop" = ["assets/*"]
